<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0A0C0A">
<title>OllK0rr3ct — traduce y aprende</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');

  :root{
    --bg:#0E0F13;
    --surface:#191B22;
    --surface-2:#22252E;
    --text:#F3F4F7;
    --text-dim:#9AA0AC;
    --border:#2C3039;
    --accent:#FF5D8F;
    --accent-2:#22D3EE;
    --stamp-1:#FF5D8F;
    --stamp-2:#22D3EE;
    --stamp-3:#A78BFA;
    --stamp-4:#FDBA31;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    padding:24px 16px 60px;
  }

  .wrap{max-width:820px;margin:0 auto;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:18px;
    margin-bottom:22px;
    gap:16px;
  }
  header h1{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:1.85rem;
    line-height:1;
    margin:0;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:-0.01em;
  }
  header h1 .cursor{
    display:inline-block;
    color:var(--accent-2);
    -webkit-text-fill-color:var(--accent-2);
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{
    0%, 49%{opacity:1;}
    50%, 100%{opacity:0;}
  }
  .drop{
    width:0.75em;
    height:0.95em;
    vertical-align:-0.15em;
    display:inline-block;
  }
  .drop .sclera{fill:#FFFFFF;stroke:#0A0C0A;stroke-width:1.8;}
  .drop .pupil{fill:#0A0C0A;}
  .drop .glint{fill:#FFFFFF;}
  .key-icon{
    width:0.68em;
    height:0.9em;
    vertical-align:-0.12em;
    fill:var(--accent);
    display:inline-block;
  }
  .key-icon.up{
    transform:rotate(-90deg);
  }
  .key-icon.down{
    transform:rotate(90deg);
  }
  header p{
    margin:6px 0 0;
    font-size:0.88rem;
    color:var(--text-dim);
  }
  .stamp-icon{
    width:54px;height:54px;flex-shrink:0;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    color:#0E0F13;
    font-size:0.7rem;
    text-align:center;
    line-height:1.1;
  }

  .flag-wave{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .flag-wave span{
    display:inline-block;
    font-size:1.6rem;
    animation:waveMotion 2.2s ease-in-out infinite;
    transform-origin:bottom center;
  }
  .flag-wave span:nth-child(1){animation-delay:0s;}
  .flag-wave span:nth-child(2){animation-delay:0.15s;}
  .flag-wave span:nth-child(3){animation-delay:0.3s;}
  .flag-wave span:nth-child(4){animation-delay:0.45s;}
  .flag-wave span:nth-child(5){animation-delay:0.6s;}
  @keyframes waveMotion{
    0%, 100%{transform:rotate(0deg) translateY(0);}
    25%{transform:rotate(-12deg) translateY(-4px);}
    50%{transform:rotate(0deg) translateY(0);}
    75%{transform:rotate(12deg) translateY(-2px);}
  }
  @media (max-width:520px){
    .flag-wave span{font-size:1.3rem;}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
  }

  label{
    display:block;
    font-size:0.78rem;
    color:var(--text-dim);
    margin-bottom:6px;
    font-weight:500;
  }

  select, textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:1rem;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    background:var(--surface-2);
    color:var(--text);
  }
  select:focus, textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  textarea{resize:vertical;min-height:64px;}

  .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .row > div{flex:1;min-width:180px;}

  .targets{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin-bottom:18px;
  }
  .lang-preview{
    font-size:1.7rem;
    text-align:center;
    margin-bottom:2px;
    line-height:1;
  }
  .target-slot{
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 8px 6px;
    background:var(--surface-2);
  }
  .target-slot select{border:none;background:transparent;padding:2px;font-size:0.82rem;}

  button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    border:none;
    border-radius:14px;
    padding:13px 22px;
    cursor:pointer;
    transition:transform .08s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-main{background:linear-gradient(90deg, var(--accent), var(--accent-2));color:#0E0F13;width:100%;}
  .btn-main:disabled{background:#3a3d47;color:var(--text-dim);}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn-danger{background:transparent;color:var(--stamp-1);font-size:0.8rem;padding:6px 10px;}

  /* Carrusel horizontal deslizable de traducciones (estilo stories) */
  .stamps-wrap{margin-top:18px;}
  .stamps{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .stamps::-webkit-scrollbar{display:none;}
  .stamp{
    scroll-snap-align:center;
    flex:0 0 78%;
    border:1.5px solid var(--c);
    border-radius:16px;
    padding:18px 16px;
    background:var(--surface-2);
  }
  .stamp .lang{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--c);
    font-weight:700;
    margin-bottom:8px;
  }
  .stamp .txt{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.2rem;
    color:var(--text);
  }
  .stamp .txt.loading{color:var(--text-dim);font-style:italic;font-family:'Inter',sans-serif;font-size:0.9rem;}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:10px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .15s ease;}
  .dot.active{background:var(--accent);width:20px;border-radius:5px;}

  .section-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.15rem;
    color:var(--text);
    margin:0 0 14px;
  }

  /* Feed vertical deslizable de vocabulario guardado (estilo TikTok) */
  .vocab-feed{
    display:flex;
    flex-direction:column;
    gap:12px;
    max-height:62vh;
    overflow-y:auto;
    scroll-snap-type:y proximity;
    padding-right:2px;
  }
  .postcard{
    scroll-snap-align:start;
    flex:0 0 auto;
    border:1px solid var(--border);
    border-radius:16px;
    background:var(--surface-2);
    padding:16px;
    cursor:pointer;
    min-height:100px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .postcard .front{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.15rem;
    color:var(--text);
  }
  .postcard .hint{font-size:0.72rem;color:var(--text-dim);margin-top:6px;}
  .postcard .back{display:none;}
  .postcard.flipped .front{display:none;}
  .postcard.flipped .back{display:block;}
  .postcard .back-lang{font-size:0.68rem;text-transform:uppercase;color:var(--accent-2);letter-spacing:0.05em;margin-bottom:3px;}
  .postcard .back-txt{font-size:0.95rem;margin-bottom:2px;color:var(--text);}
  .postcard-footer{display:flex;justify-content:flex-end;margin-top:8px;}

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-size:0.9rem;
    padding:30px 10px;
    border:1.5px dashed var(--border);
    border-radius:14px;
  }

  .status{font-size:0.85rem;color:var(--text-dim);margin-top:10px;min-height:1.1em;}

  /* Ajustes específicos para pantalla de celular */
  @media (max-width: 520px){
    body{padding:18px 12px 50px;}
    header h1{font-size:1.7rem;}
    .panel{padding:14px;border-radius:16px;}
    select, textarea{font-size:1.05rem;padding:13px 12px;}
    .targets{grid-template-columns:repeat(2, 1fr);}
    .lang-preview{font-size:2rem;}
    .row{flex-direction:column;}
    .row > div{min-width:100%;}
    .stamp{flex:0 0 86%;}
    #micBtn{width:auto;padding:12px 16px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1><svg class="drop" viewBox="0 0 24 24"><circle class="sclera" cx="12" cy="12" r="9.5"/><circle class="pupil" cx="16" cy="13" r="4.8"/><circle class="glint" cx="17.5" cy="10.5" r="1.4"/></svg><svg class="key-icon up" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg><svg class="key-icon down" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>K<svg class="drop" viewBox="0 0 24 24"><circle class="sclera" cx="12" cy="12" r="9.5"/><circle class="pupil" cx="8" cy="13" r="4.8"/><circle class="glint" cx="9.5" cy="10.5" r="1.4"/></svg>rr3ct<span class="cursor">_</span></h1>
      <p>Escribe y mira la traducción aparecer sola en 4 idiomas a la vez, con audio de pronunciación. Guarda las que quieras repasar.</p>
    </div>
    <div class="flag-wave">
      <span>🇪🇸</span><span>🇬🇧</span><span>🇫🇷</span><span>🇯🇵</span><span>🇧🇷</span>
    </div>
  </header>

  <div class="panel">
    <div class="row">
      <div>
        <label for="source">Idioma de origen</label>
        <div class="lang-preview" id="sourcePreview">🇪🇸</div>
        <select id="source"></select>
      </div>
      <div style="flex:2;">
        <label for="phrase">Palabra o frase</label>
        <div style="display:flex;gap:8px;align-items:flex-start;">
          <textarea id="phrase" maxlength="500" placeholder="Empieza a escribir… se traduce solo" style="flex:1;"></textarea>
          <button id="micBtn" type="button" title="Dictar por voz" style="background:var(--gold);color:#fff;padding:10px 14px;font-size:1.1rem;flex-shrink:0;">🎤</button>
        </div>
        <div id="charCount" style="font-size:0.72rem;color:#9a927a;margin-top:2px;text-align:right;">0 / 500</div>
        <div id="micStatus" style="font-size:0.78rem;color:#8C3B2E;margin-top:4px;min-height:1.1em;"></div>
      </div>
    </div>

    <label>Traducir hacia (elige hasta 4, más de 30 idiomas disponibles)</label>
    <div class="targets" id="targets"></div>

    <button class="btn-main" id="translateBtn">Traducir ahora</button>
    <div class="status" id="status"></div>

    <div class="stamps-wrap">
      <div class="stamps" id="stamps"></div>
      <div class="dots" id="stampDots"></div>
    </div>
  </div>

  <div class="panel">
    <h2 class="section-title">Tu vocabulario guardado</h2>
    <div class="vocab-feed" id="vocabList"></div>
    <div class="empty" id="vocabEmpty">Aún no has guardado ninguna palabra. Tradúcela y pulsa "Guardar" para empezar tu mazo de estudio.</div>
  </div>

</div>

<script>
const LANGS = [
  ["es","Español"],["en","Inglés"],["fr","Francés"],["pt","Portugués"],
  ["it","Italiano"],["de","Alemán"],["nl","Neerlandés"],["ja","Japonés"],
  ["ko","Coreano"],["zh","Chino"],["ru","Ruso"],["ar","Árabe"],
  ["tr","Turco"],["sv","Sueco"],["pl","Polaco"],["hi","Hindi"],
  ["da","Danés"],["no","Noruego"],["fi","Finlandés"],["cs","Checo"],
  ["el","Griego"],["he","Hebreo"],["th","Tailandés"],["vi","Vietnamita"],
  ["id","Indonesio"],["ro","Rumano"],["hu","Húngaro"],["uk","Ucraniano"],
  ["bg","Búlgaro"],["sk","Eslovaco"],["fa","Persa"],["bn","Bengalí"],
  ["ta","Tamil"],["sw","Suajili"],["ca","Catalán"],["gl","Gallego"]
];
// Locales BCP-47 para el motor de voz del navegador (pronunciación en audio)
const SPEECH_LOCALE = {
  es:"es-ES", en:"en-US", fr:"fr-FR", pt:"pt-PT", it:"it-IT", de:"de-DE",
  nl:"nl-NL", ja:"ja-JP", ko:"ko-KR", zh:"zh-CN", ru:"ru-RU", ar:"ar-SA",
  tr:"tr-TR", sv:"sv-SE", pl:"pl-PL", hi:"hi-IN", da:"da-DK", no:"nb-NO",
  fi:"fi-FI", cs:"cs-CZ", el:"el-GR", he:"he-IL", th:"th-TH", vi:"vi-VN",
  id:"id-ID", ro:"ro-RO", hu:"hu-HU", uk:"uk-UA", bg:"bg-BG", sk:"sk-SK",
  fa:"fa-IR", bn:"bn-BD", ta:"ta-IN", sw:"sw-KE", ca:"ca-ES", gl:"gl-ES"
};
const DEFAULT_TARGETS = ["en","fr","pt","it"];
const STAMP_COLORS = ["--stamp-1","--stamp-2","--stamp-3","--stamp-4"];

const sourceSel = document.getElementById('source');
const targetsDiv = document.getElementById('targets');
const stampsDiv = document.getElementById('stamps');
const statusDiv = document.getElementById('status');
const vocabListDiv = document.getElementById('vocabList');
const vocabEmptyDiv = document.getElementById('vocabEmpty');

const FLAG = {
  es:"🇪🇸", en:"🇬🇧", fr:"🇫🇷", pt:"🇵🇹", it:"🇮🇹", de:"🇩🇪",
  nl:"🇳🇱", ja:"🇯🇵", ko:"🇰🇷", zh:"🇨🇳", ru:"🇷🇺", ar:"🇸🇦",
  tr:"🇹🇷", sv:"🇸🇪", pl:"🇵🇱", hi:"🇮🇳", da:"🇩🇰", no:"🇳🇴",
  fi:"🇫🇮", cs:"🇨🇿", el:"🇬🇷", he:"🇮🇱", th:"🇹🇭", vi:"🇻🇳",
  id:"🇮🇩", ro:"🇷🇴", hu:"🇭🇺", uk:"🇺🇦", bg:"🇧🇬", sk:"🇸🇰",
  fa:"🇮🇷", bn:"🇧🇩", ta:"🇱🇰", sw:"🇰🇪", ca:"🏴", gl:"🏴"
};
function langName(code){ const f = LANGS.find(l=>l[0]===code); return f ? f[1] : code; }

function fillSelect(sel, selected){
  sel.innerHTML = LANGS.map(([code,name]) =>
    `<option value="${code}" ${code===selected?'selected':''}>${FLAG[code]||''} ${name}</option>`
  ).join('');
}

fillSelect(sourceSel, 'es');
sourceSel.addEventListener('change', () => {
  document.getElementById('sourcePreview').textContent = FLAG[sourceSel.value] || '🌐';
});
for(let i=0;i<4;i++){
  const wrap = document.createElement('div');
  wrap.className = 'target-slot';
  const preview = document.createElement('div');
  preview.className = 'lang-preview';
  preview.id = 'preview'+i;
  const sel = document.createElement('select');
  sel.id = 'target'+i;
  wrap.appendChild(preview);
  wrap.appendChild(sel);
  targetsDiv.appendChild(wrap);
  fillSelect(sel, DEFAULT_TARGETS[i]);
  preview.textContent = FLAG[DEFAULT_TARGETS[i]] || '🌐';
  sel.addEventListener('change', () => {
    preview.textContent = FLAG[sel.value] || '🌐';
  });
}

// Mini diccionario de respaldo: se usa SOLO si la llamada a la API externa
// está bloqueada (como ocurre dentro de la vista previa de Claude). En una
// página publicada de verdad, la API responde directamente y esto no se usa.
const OFFLINE_DICT = {
  "hola":        { en:"hello",     fr:"bonjour",       pt:"olá",          it:"ciao",       de:"hallo" },
  "buenos dias": { en:"good morning", fr:"bonjour",     pt:"bom dia",      it:"buongiorno", de:"guten morgen" },
  "buenos días": { en:"good morning", fr:"bonjour",     pt:"bom dia",      it:"buongiorno", de:"guten morgen" },
  "gracias":     { en:"thank you",  fr:"merci",         pt:"obrigado",     it:"grazie",     de:"danke" },
  "por favor":   { en:"please",     fr:"s'il vous plaît", pt:"por favor",  it:"per favore", de:"bitte" },
  "adios":       { en:"goodbye",    fr:"au revoir",     pt:"adeus",        it:"arrivederci", de:"auf wiedersehen" },
  "adiós":       { en:"goodbye",    fr:"au revoir",     pt:"adeus",        it:"arrivederci", de:"auf wiedersehen" },
  "amigo":       { en:"friend",     fr:"ami",           pt:"amigo",        it:"amico",      de:"freund" },
  "agua":        { en:"water",      fr:"eau",           pt:"água",         it:"acqua",      de:"wasser" },
  "comida":      { en:"food",       fr:"nourriture",    pt:"comida",       it:"cibo",       de:"essen" },
  "amor":        { en:"love",       fr:"amour",         pt:"amor",         it:"amore",      de:"liebe" },
  "como estas":  { en:"how are you", fr:"comment ça va", pt:"como você está", it:"come stai", de:"wie geht es dir" },
  "cómo estás":  { en:"how are you", fr:"comment ça va", pt:"como você está", it:"come stai", de:"wie geht es dir" }
};

let usedOfflineFallback = false;

async function translateOne(text, source, target){
  if(source === target){
    return text;
  }
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}`;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('fallo de red');
    const data = await res.json();
    if(!data || !data.responseData) throw new Error('sin respuesta');
    const translated = data.responseData.translatedText || '';
    if(translated.toUpperCase().includes('QUERY LENGTH LIMIT')){
      throw new Error('LIMITE_CARACTERES');
    }
    return translated;
  }catch(networkErr){
    // Vista previa en sandbox: probamos el diccionario local de respaldo.
    const key = text.trim().toLowerCase();
    const entry = OFFLINE_DICT[key];
    if(entry && entry[target]){
      usedOfflineFallback = true;
      return entry[target] + ' *';
    }
    throw new Error('sin traducción disponible en modo demo');
  }
}

let voicesReady = [];
function loadVoices(){ voicesReady = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

let activeSpeechBtn = null;

function togglePlayPause(text, langCode, btn){
  if(!('speechSynthesis' in window)){
    alert('Tu navegador no soporta audio de voz.');
    return;
  }
  const synth = window.speechSynthesis;
  const cleanText = text.replace(/\s\*$/, '');

  // Si este mismo botón ya está sonando, lo pausamos (no lo reiniciamos).
  if(activeSpeechBtn === btn && synth.speaking && !synth.paused){
    synth.pause();
    btn.textContent = '▶️';
    return;
  }
  // Si este mismo botón está en pausa, lo reanudamos donde iba.
  if(activeSpeechBtn === btn && synth.paused){
    synth.resume();
    btn.textContent = '⏸️';
    return;
  }
  // Cualquier otro audio se detiene por completo antes de empezar uno nuevo.
  synth.cancel();
  if(activeSpeechBtn) activeSpeechBtn.textContent = '🔊';

  const targetLocale = SPEECH_LOCALE[langCode] || langCode;
  const utter = new SpeechSynthesisUtterance(cleanText);
  utter.lang = targetLocale;
  utter.rate = 0.8; // un poco más lento para que se entienda mejor

  if(!voicesReady.length) loadVoices();
  const match = voicesReady.find(v => v.lang === targetLocale) ||
                voicesReady.find(v => v.lang.startsWith(targetLocale.split('-')[0]));
  if(match) utter.voice = match;

  utter.onend = () => { btn.textContent = '🔊'; if(activeSpeechBtn === btn) activeSpeechBtn = null; };
  utter.onerror = () => { btn.textContent = '🔊'; };

  activeSpeechBtn = btn;
  btn.textContent = '⏸️';
  synth.speak(utter);
}

function copyText(text, btn){
  const cleanText = text.replace(/\s\*$/, '');
  navigator.clipboard.writeText(cleanText).then(() => {
    const original = btn.textContent;
    btn.textContent = '✅';
    setTimeout(() => { btn.textContent = original; }, 1200);
  }).catch(() => {
    btn.textContent = '⚠️';
  });
}

let lastRunId = 0;

function setupCarouselSync(){
  let scrollTimer = null;
  stampsDiv.onscroll = () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const cardWidth = stampsDiv.children[0] ? stampsDiv.children[0].offsetWidth + 12 : 1;
      const idx = Math.round(stampsDiv.scrollLeft / cardWidth);
      document.querySelectorAll('#stampDots .dot').forEach((d,i) => {
        d.classList.toggle('active', i === idx);
      });
    }, 80);
  };
}

async function doTranslate(){
  const text = document.getElementById('phrase').value.trim();
  if(!text){
    stampsDiv.innerHTML = '';
    statusDiv.textContent = '';
    return;
  }
  const source = sourceSel.value;
  const targets = [0,1,2,3].map(i => document.getElementById('target'+i).value);

  const runId = ++lastRunId; // evita que respuestas viejas pisen resultados nuevos
  usedOfflineFallback = false;
  statusDiv.textContent = 'Traduciendo en tiempo real…';

  stampsDiv.innerHTML = targets.map((t,i) => `
    <div class="stamp" data-idx="${i}" style="--c:var(${STAMP_COLORS[i]})">
      <div class="lang">${FLAG[t]||''} ${langName(t)}</div>
      <div class="txt loading">traduciendo…</div>
    </div>
  `).join('');

  const dotsDiv = document.getElementById('stampDots');
  dotsDiv.innerHTML = targets.map((_,i) => `<div class="dot ${i===0?'active':''}" data-dot="${i}"></div>`).join('');
  setupCarouselSync();

  const results = [];
  for(let i=0;i<targets.length;i++){
    try{
      const translated = await translateOne(text, source, targets[i]);
      if(runId !== lastRunId) return; // el usuario ya siguió escribiendo, descarta esto
      results[i] = translated;
      const stampEl = stampsDiv.children[i].querySelector('.txt');
      stampEl.innerHTML = '';
      const span = document.createElement('span');
      span.textContent = translated;

      const playBtn = document.createElement('button');
      playBtn.textContent = '🔊';
      playBtn.title = 'Escuchar / pausar pronunciación';
      playBtn.style.cssText = 'background:none;border:none;cursor:pointer;font-size:1rem;padding:0 4px;vertical-align:middle;';
      playBtn.addEventListener('click', () => togglePlayPause(translated, targets[i], playBtn));

      const copyBtn = document.createElement('button');
      copyBtn.textContent = '📋';
      copyBtn.title = 'Copiar traducción';
      copyBtn.style.cssText = 'background:none;border:none;cursor:pointer;font-size:1rem;padding:0 0 0 4px;vertical-align:middle;';
      copyBtn.addEventListener('click', () => copyText(translated, copyBtn));

      stampEl.appendChild(span);
      stampEl.appendChild(playBtn);
      stampEl.appendChild(copyBtn);
      stampEl.classList.remove('loading');
    }catch(e){
      if(runId !== lastRunId) return;
      results[i] = null;
      const stampEl = stampsDiv.children[i].querySelector('.txt');
      stampEl.textContent = e.message === 'LIMITE_CARACTERES'
        ? 'texto muy largo, acorta la frase'
        : 'no se pudo traducir';
      stampEl.classList.remove('loading');
    }
  }

  if(runId !== lastRunId) return;
  statusDiv.innerHTML = '';
  if(usedOfflineFallback){
    const note = document.createElement('div');
    note.style.cssText = 'font-size:0.78rem;color:#8C3B2E;margin-bottom:8px;';
    note.textContent = '* Modo demo (vista previa sin acceso a internet): usando diccionario local. Prueba con hola, gracias, buenos días, por favor, adiós, amigo, agua, comida, amor, cómo estás. Al publicar la página fuera de esta vista, cualquier palabra funcionará con la API real.';
    statusDiv.appendChild(note);
  }
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn-ghost';
  saveBtn.textContent = 'Guardar en mi vocabulario';
  saveBtn.style.marginTop = '4px';
  saveBtn.addEventListener('click', () => saveEntry(text, source, targets, results, saveBtn));
  statusDiv.appendChild(saveBtn);

  const copyAllBtn = document.createElement('button');
  copyAllBtn.className = 'btn-ghost';
  copyAllBtn.textContent = 'Copiar todo';
  copyAllBtn.style.cssText = 'margin-top:4px;margin-left:8px;';
  copyAllBtn.addEventListener('click', () => {
    const allText = targets.map((t,i) => results[i] ? `${langName(t)}: ${results[i].replace(/\s\*$/,'')}` : '').filter(Boolean).join('\n');
    navigator.clipboard.writeText(allText).then(() => {
      copyAllBtn.textContent = 'Copiado ✅';
      setTimeout(() => { copyAllBtn.textContent = 'Copiar todo'; }, 1200);
    });
  });
  statusDiv.appendChild(copyAllBtn);
}

document.getElementById('translateBtn').addEventListener('click', doTranslate);

// Traducción en tiempo real: se dispara sola una fracción de segundo
// después de dejar de escribir, sin necesidad de tocar el botón.
let debounceTimer = null;
document.getElementById('phrase').addEventListener('input', () => {
  const len = document.getElementById('phrase').value.length;
  const counter = document.getElementById('charCount');
  counter.textContent = len + ' / 500';
  counter.style.color = len > 450 ? '#8C3B2E' : '#9a927a';
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(doTranslate, 500);
});
sourceSel.addEventListener('change', doTranslate);
[0,1,2,3].forEach(i => {
  document.addEventListener('change', (e) => {
    if(e.target && e.target.id === 'target'+i) doTranslate();
  });
});

async function saveEntry(text, source, targets, results, btnEl){
  const entry = {
    id: 'v'+Date.now(),
    text, source,
    translations: targets.map((t,i)=>({lang:t, text:results[i]})).filter(t=>t.text),
    savedAt: Date.now()
  };
  try{
    const listRes = await window.storage.get('vocab-list').catch(()=>null);
    const list = listRes ? JSON.parse(listRes.value) : [];
    list.unshift(entry);
    await window.storage.set('vocab-list', JSON.stringify(list));
    btnEl.textContent = 'Guardado ✓';
    btnEl.disabled = true;
    loadVocab();
  }catch(e){
    btnEl.textContent = 'Error al guardar';
  }
}

async function loadVocab(){
  let list = [];
  try{
    const res = await window.storage.get('vocab-list');
    list = res ? JSON.parse(res.value) : [];
  }catch(e){
    list = [];
  }
  vocabEmptyDiv.style.display = list.length ? 'none' : 'block';
  vocabListDiv.innerHTML = list.map(entry => `
    <div class="postcard" data-id="${entry.id}">
      <div>
        <div class="front">
          <div style="font-size:0.7rem;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;">${FLAG[entry.source]||''} ${langName(entry.source)}</div>
          ${entry.text}
        </div>
        <div class="back">
          ${entry.translations.map(t => `
            <div class="back-lang">${FLAG[t.lang]||''} ${langName(t.lang)}</div>
            <div class="back-txt">${t.text}</div>
          `).join('')}
        </div>
        <div class="hint">toca para voltear</div>
      </div>
      <div class="postcard-footer">
        <button class="btn-danger" data-del="${entry.id}">eliminar</button>
      </div>
    </div>
  `).join('');

  vocabListDiv.querySelectorAll('.postcard').forEach(card => {
    card.addEventListener('click', (e) => {
      if(e.target.dataset.del) return;
      card.classList.toggle('flipped');
    });
  });
  vocabListDiv.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.dataset.del;
      try{
        const res = await window.storage.get('vocab-list');
        let list = res ? JSON.parse(res.value) : [];
        list = list.filter(x => x.id !== id);
        await window.storage.set('vocab-list', JSON.stringify(list));
        loadVocab();
      }catch(err){}
    });
  });
}

loadVocab();

// Dictado por voz: usa el reconocimiento de voz del navegador (Chrome en
// Android lo soporta bien). Requiere permiso de micrófono y, en un sitio
// publicado de verdad, conexión HTTPS (GitHub Pages y Netlify ya la traen).
const micBtn = document.getElementById('micBtn');
const micStatus = document.getElementById('micStatus');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognitionAPI){
  micBtn.disabled = true;
  micBtn.style.opacity = '0.4';
  micBtn.title = 'Tu navegador no soporta dictado por voz';
} else {
  const recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  let listening = false;

  micBtn.addEventListener('click', () => {
    if(listening){
      recognition.stop();
      return;
    }
    recognition.lang = SPEECH_LOCALE[sourceSel.value] || 'es-ES';
    try{
      recognition.start();
    }catch(e){
      micStatus.textContent = 'No se pudo iniciar el micrófono. Intenta de nuevo.';
    }
  });

  recognition.addEventListener('start', () => {
    listening = true;
    micBtn.textContent = '⏺️';
    micStatus.textContent = 'Escuchando… habla ahora en ' + langName(sourceSel.value);
  });

  recognition.addEventListener('result', (event) => {
    const said = event.results[0][0].transcript;
    document.getElementById('phrase').value = said;
    micStatus.textContent = 'Escuchado: "' + said + '"';
    doTranslate();
  });

  recognition.addEventListener('error', (event) => {
    listening = false;
    micBtn.textContent = '🎤';
    if(event.error === 'not-allowed' || event.error === 'permission-denied'){
      micStatus.textContent = 'Necesitas dar permiso de micrófono al navegador para dictar.';
    } else if(event.error === 'no-speech'){
      micStatus.textContent = 'No se detectó voz, intenta de nuevo.';
    } else {
      micStatus.textContent = 'El dictado por voz solo funciona en la app publicada, no en esta vista previa.';
    }
  });

  recognition.addEventListener('end', () => {
    listening = false;
    micBtn.textContent = '🎤';
  });
}

// Registro del service worker (necesario para instalar como PWA)
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
